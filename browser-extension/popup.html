<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>觅同当前页面采集</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icon.svg" alt=""><div><h1>采集当前页面</h1><p>沿用你平时浏览器里的登录状态</p></div></header>
<main><p class="tip">先正常打开 Temu 商品或店铺，确认内容可见，再点读取。不会替你登录或跳转页面。</p><button id="read" class="primary">读取当前页面</button>
<section id="capture" hidden><p id="page-title" class="title"></p><p id="page-note" class="small"></p><div id="store-selection" hidden><label>选择本次商品（每批最多 20 款）<select id="store-batch" aria-label="选择店铺商品批次"></select></label><div id="store-cards" class="store-cards"></div><p id="selected-count" class="small" role="status"></p></div><label>所属店铺链接<input id="store-url" type="url" placeholder="https://www.temu.com/mall.html?mall_id=…"></label><label>店铺名称（选填）<input id="store-name" maxlength="160" placeholder="如 Luminova Crystals"></label><label class="confirm"><input id="confirmed" type="checkbox"> 我已确认当前商品属于此店铺</label><button id="add" class="primary">加入本批采集</button></section>
<p id="status" role="status" aria-live="polite"></p><section class="batch"><div class="between"><h2>本批 <span id="count">0</span>/20 页</h2><button id="clear" class="quiet">清空本批</button></div><ol id="pages"></ol><button id="export" class="primary" disabled>导出采集文件</button><p class="small">回到觅同 → 批量入库 → 从浏览器页面导入，选择导出的 JSON 文件，核对后再入库。采集不会直接改商品库。</p></section><p class="small muted">只读取公开商品字段，不读取密码、Cookie、账号输入框或浏览历史。未读到的规格与报价保留为空；店铺页仅包含当前已加载的商品。</p></main>
<script src="capture-core.js"></script><script src="popup.js"></script></body></html>
